id: io.github.shmmodbus.shm-modbus
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: shm-modbus
base: io.qt.PySide.BaseApp
base-version: '6.9'
build-options:
  env:
    - BASEAPP_REMOVE_WEBENGINE=1
    - BASEAPP_DISABLE_NUMPY=1
cleanup-commands:
  - /app/cleanup-BaseApp.sh
finish-args:
  - --device=shm
  - --device=dri
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
modules:
  - name: cxxopts
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCXXOPTS_BUILD_EXAMPLES=OFF
      - -DCXXOPTS_BUILD_TESTS=OFF
    sources:
      - type: git
        tag: v3.3.1
        url: https://github.com/jarro2783/cxxopts.git

  - name: cxxshm
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLANG_FORMAT=OFF
      - -DCOMPILER_WARNINGS=OFF
      - -DCLANG_TIDY=OFF
      - -DBUILD_DOC=OFF
      - -DENABLE_TEST=OFF
    sources:
      - type: git
        tag: v2.0.4
        url: https://github.com/NikolasK-source/cxxshm.git

  - name: cxxsemaphore
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLANG_FORMAT=OFF
      - -DCOMPILER_WARNINGS=OFF
      - -DCLANG_TIDY=OFF
      - -DBUILD_DOC=OFF
      - -DENABLE_TEST=OFF
    sources:
      - type: git
        tag: v2.0.4
        url: https://github.com/NikolasK-source/cxxsemaphore.git

  - name: cxxitimer
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLANG_FORMAT=OFF
      - -DCOMPILER_WARNINGS=OFF
      - -DCLANG_TIDY=OFF
      - -DBUILD_DOC=OFF
      - -DENABLE_TEST=OFF
    sources:
      - type: git
        tag: v2.0.4
        url: https://github.com/NikolasK-source/cxxitimer.git

  - name: nlohmann_json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
    sources:
      - type: git
        tag: v3.12.0
        url: https://github.com/nlohmann/json.git

  - name: libmodbus
    buildsystem: autotools
    sources:
      - type: git
        tag: v3.1.11
        url: https://github.com/stephane/libmodbus.git

  - name: Modbus_TCP_client_shm
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLANG_FORMAT=OFF
      - -DCOMPILER_WARNINGS=OFF
      - -DCLANG_TIDY=OFF
      - -DENABLE_TEST=OFF
      - -DBUILD_DOC=OFF

    sources:
      - type: git
        tag: v1.6.3
        url: https://github.com/SHMModbus/modbus_tcp_client_shm.git
        disable-shallow-clone: true

  - name: signal_gen
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps .
      - mv /app/bin/signalgen /app/bin/signal-gen
      - ln -s /app/bin/signal-gen /app/bin/shm-modbus-signal-gen
    sources:
      - type: git
        tag: v1.0.2
        commit: ae911cceebaedfd4d6acab0a9f66d237ea79e3e8
        url: https://github.com/SHMModbus/shm-modbus-signal-gen.git

  - name: gui
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-deps .
    sources:
      - type: git
        tag: v2.1.2
        url: https://github.com/SHMModbus/shm_modbus_gui.git

  - name: Modbus_RTU_client_shm
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLANG_FORMAT=OFF
      - -DCOMPILER_WARNINGS=OFF
      - -DCLANG_TIDY=OFF
      - -DENABLE_TEST=OFF

    sources:
      - type: git
        tag: v1.0.0
        url: https://github.com/SHMModbus/modbus_rtu_client_shm.git
        disable-shallow-clone: true

  - name: write_shm
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLANG_FORMAT=OFF
      - -DCOMPILER_WARNINGS=OFF
      - -DCLANG_TIDY=OFF
      - -DENABLE_TEST=OFF
      - -DBUILD_DOC=OFF

    sources:
      - type: git
        tag: v1.1.1
        url: https://github.com/SHMModbus/write_shm.git

  - name: shm_format
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLANG_FORMAT=OFF
      - -DCOMPILER_WARNINGS=OFF
      - -DCLANG_TIDY=OFF
      - -DENABLE_TEST=OFF
      - -DBUILD_DOC=OFF

    sources:
      - type: git
        tag: v2.0.1
        url: https://github.com/SHMModbus/shm_format.git

  - name: SHM_random
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLANG_FORMAT=OFF
      - -DCOMPILER_WARNINGS=OFF
      - -DCLANG_TIDY=OFF
      - -DENABLE_TEST=OFF
      - -DBUILD_DOC=OFF

    sources:
      - type: git
        tag: v1.4.1
        url: https://github.com/SHMModbus/shared_mem_random.git

  - name: dump_shm
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLANG_FORMAT=OFF
      - -DCOMPILER_WARNINGS=OFF
      - -DCLANG_TIDY=OFF
      - -DENABLE_TEST=OFF
      - -DBUILD_DOC=OFF

    sources:
      - type: git
        tag: v1.3.1
        url: https://github.com/SHMModbus/dump_shm.git

  - name: stdin-to-modbus-shm
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLANG_FORMAT=OFF
      - -DCOMPILER_WARNINGS=OFF
      - -DCLANG_TIDY=OFF
      - -DENABLE_TEST=OFF
      - -DBUILD_DOC=OFF

    sources:
      - type: git
        tag: v1.5.0
        url: https://github.com/SHMModbus/stdin_to_modbus_shm.git

  - name: wago-modbus-coupler-shm
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCLANG_FORMAT=OFF
      - -DCOMPILER_WARNINGS=OFF
      - -DBUILD_DOC=OFF

    post-install:
      - mv ${FLATPAK_DEST}/bin/wago_modbus_coupler_shm ${FLATPAK_DEST}/bin/wago-modbus-coupler-shm

    sources:
      - type: git
        tag: v1.1.1
        url: https://github.com/SHMModbus/wago_modbus_coupler_shm.git

  - name: launch_scripts_and_metadata
    buildsystem: simple
    build-commands:
      - install -D -m 755 shm-modbus ${FLATPAK_DEST}/bin/shm-modbus
      - install -D -m 644 ${FLATPAK_ID}.metainfo.xml "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
      - install -D -m 644 -t "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps" ${FLATPAK_ID}.svg
      - install -D -m 644 ${FLATPAK_ID}_256.png "${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png"
      - install -D -m 644 -t ${FLATPAK_DEST}/share/applications/ ${FLATPAK_ID}.desktop

    sources:
      - type: git
        tag: v2.1.3
        url: https://github.com/SHMModbus/SHM_Modbus.git
